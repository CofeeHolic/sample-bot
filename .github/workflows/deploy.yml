name: Deploy Trading Bot to AWS

on:
  push:
    branches:
      - main-1   # Change if your branch name is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ${{ secrets.AWS_USER }}
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          set -e

          # Go to project directory or clone if missing
          export PROJECT_DIR=~/trading-bot
          if [ ! -d "$PROJECT_DIR" ]; then
            echo "Cloning repository..."
            git clone https://github.com/${{ github.repository }}.git $PROJECT_DIR
          fi
          cd $PROJECT_DIR

          # Pull latest changes
          git checkout main-1
          git pull origin main-1

          # Ensure Python 3.12 venv exists
          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi
          source venv/bin/activate

          # Install/update dependencies
          pip install --upgrade pip
          pip install -r requirements.txt || true

          # Stop old process
          pkill -f "<YOUR_PYTHON_FILE>" || true

          # Start new process
          nohup python3 <YOUR_PYTHON_FILE> > bot.log 2>&1 &

          echo "✅ Deployment successful"
